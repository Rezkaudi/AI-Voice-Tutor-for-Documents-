# Google Cloud Build: build the image, push to Artifact Registry, deploy to Cloud Run.
#
# One-time setup:
#   gcloud artifacts repositories create apps \
#       --repository-format=docker --location=$_REGION
#
# Deploy:
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_REGION=us-central1
#
# (run from the ocr-service/ directory so the build context is this folder)

substitutions:
  _REGION: us-central1
  _REPO: apps
  _SERVICE: ocr-service

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8080"
      # RapidOCR models need >=2GB RAM (per project measurements).
      - "--memory=2Gi"
      - "--cpu=2"
      - "--timeout=300"
      - "--concurrency=4"
      - "--min-instances=0"
      - "--max-instances=3"
      # Lock this down: allow only the backend's service account instead.
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
